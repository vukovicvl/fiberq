# ci/coverage.ini - the settings of the test-coverage stage (sh ci/test.sh coverage). The stage names this file with
# --rcfile, so coverage reads no other file: the tested tree's pyproject.toml ([tool.coverage.*]) is never read, and
# every tree (v1.6.0 through --ref, as later ones) is measured the same way. COVERAGE_FILE puts the data in CI_WORK.
[run]
# the tested tree's package folder (the stage runs in the tree); a module that is never imported is reported too,
# with no statement run
source_dirs = fiberq
# statement coverage (branch is off, the default), always with the same core: sys.monitoring, Python 3.12 and later
core = sysmon
# one data file per process. "subprocess" hands this configuration to every Python child process the tests start
# (COVERAGE_PROCESS_CONFIG), and the stage's sitecustomize.py starts coverage there; "_exit" saves a process's data
# when it ends with os._exit(), as the tests' QGIS drivers do
parallel = True
patch =
    subprocess
    _exit

[report]
precision = 1
