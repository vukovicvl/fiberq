# Tool configuration for FiberQ dev tooling.
# NOTE: flake8 does NOT read pyproject.toml - its config lives in .flake8.

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
# The repo root, so that `import fiberq` works (the plugin package is fiberq/), and tests/, so that test
# files import tests/support/ as `support` in any import mode.
pythonpath = [".", "tests"]
addopts = "-ra"
markers = [
    "qgis: test needs a running QgsApplication (provided by pytest-qgis)",
    "slow: builds a large fixture; deselect with -m 'not slow'",
]

[tool.coverage.run]
source = ["fiberq"]
omit = [
    "fiberq/__init__.py",
    "*/resources/*",
    "*/styles/*",
    "*/icons/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.bandit]
# No severity threshold on the CLI — the plugins.qgis.org scanner runs ALL
# severities (it blocks on LOW findings like B110/B112). List B-IDs here only if
# a finding ever needs skipping. Prefer an inline `# nosec Bxxx` with a reason.
exclude_dirs = ["tests", "build", "dist", ".venv"]
