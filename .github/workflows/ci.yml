# SPDX-License-Identifier: GPL-3.0-or-later
# GitHub Actions for FiberQ: a thin wrapper around the pipeline in ci/ (ci/README.md). Each job checks out the
# commit, pulls the images of one stage (sh ci/pull.sh), runs that stage (sh ci/run-all.sh --only <stage>) and
# uploads its run record from ci-results/. All the logic is in ci/, and the same commands run on any machine
# that ci/README.md's "What the host needs" describes.
#   push to a branch (not release/*)  the default set: pure lint qt6 floor package test-322 test-344 test-42
#   push to release/*, push of a tag  the release set (--release): the default set, test-340, test-40 and
#                                     release-check
#   Run workflow (workflow_dispatch)  the release set, on the branch or tag picked
#   pull request                      the default set, only from a fork: a branch of this repository already
#                                     runs on its push
# A push that deletes a branch or a tag runs nothing.
# Each run: line starts its script with exec, so the script is the step's own process: when a job is cancelled
# or times out, the runner's SIGINT reaches ci/run-all.sh, which kills the run's containers and records the run
# as interrupted before the upload step. Without exec the step's process is the bash that runs the line, and
# bash does not pass the signal on.
# The lint stage reads this file line by line (ci/lint.sh, check "wrappers"): every run: is one line, exec sh
# ci/<script>.sh, then optionally --release and --only, and last ${{ matrix.stage }}; every uses: is
# actions/checkout or actions/upload-artifact pinned to a commit; no container, services, shell, env, defaults,
# working-directory, continue-on-error, matrix include or exclude, and no checkout input that fetches other code;
# and the two stage: lists are the default and release sets of ci/common.sh. It does not read the triggers (on:)
# or the conditions: a job or a step switched off by its if: is review's to catch.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  default:
    if: >-
      (github.event_name == 'push' && !github.event.deleted &&
      !startsWith(github.ref, 'refs/heads/release/') && !startsWith(github.ref, 'refs/tags/')) ||
      (github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name != github.repository)
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        stage: [pure, lint, qt6, floor, package, test-322, test-344, test-42]
    steps:
      - name: Check out the commit, with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pull the stage's images
        run: exec sh ci/pull.sh ${{ matrix.stage }}
      - name: Run the stage
        run: exec sh ci/run-all.sh --only ${{ matrix.stage }}
      - name: Upload the run record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-results-default-${{ matrix.stage }}-${{ github.run_attempt }}
          path: |
            ci-results/
            !ci-results/*/input/**
            !ci-results/*/raw/**
            !ci-results/*/deps/raw/**
            !ci-results/**/deps.tar

  release:
    if: >-
      (github.event_name == 'push' && !github.event.deleted &&
      (startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/tags/'))) ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        stage: [pure, lint, qt6, floor, package, test-322, test-340, test-344, test-40, test-42, release-check]
    steps:
      - name: Check out the commit, with full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pull the stage's images
        run: exec sh ci/pull.sh ${{ matrix.stage }}
      - name: Run the stage under the release rules
        run: exec sh ci/run-all.sh --release --only ${{ matrix.stage }}
      - name: Upload the run record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ci-results-release-${{ matrix.stage }}-${{ github.run_attempt }}
          path: |
            ci-results/
            !ci-results/*/input/**
            !ci-results/*/raw/**
            !ci-results/*/deps/raw/**
            !ci-results/**/deps.tar
